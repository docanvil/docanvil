name: CI

# Every master push completes CI before Pages starts. Docs-only pushes skip
# compilation and testing, retaining the existing master binary for reuse.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  changes:
    name: Check application changes
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.changes.outputs.application }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether to build
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          application=true
          if [[ "$EVENT" == push && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            application_files=$(printf '%s\n' "$changed" | rg -v '^(docs/|[^/]+\.md$)' || true)
            if [[ -z "$application_files" ]]; then
              application=false
            fi
          fi
          echo "application=$application" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Shellcheck installer
        run: shellcheck install/install.sh

  # Release notes are extracted from CHANGELOG.md, so a release PR must carry
  # a non-empty section for its version (bin/release.sh normally creates it).
  changelog:
    name: Changelog
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check changelog has entries for this release
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          VERSION="${HEAD_REF#release/v}"
          NOTES=$(awk -v h="## [${VERSION}]" '
            index($0, h) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && NF { print }
          ' CHANGELOG.md)
          if ! echo "$NOTES" | grep -qv '^#'; then
            echo "::error file=CHANGELOG.md::No entries under '## [${VERSION}]'. Release with bin/release.sh, or move the [Unreleased] entries under this version."
            exit 1
          fi
          echo "Found changelog entries for ${VERSION}:"
          echo "$NOTES"

  # Extra release targets (musl, ARM, Intel Mac) only build at release time.
  # Build them on release PRs, or any PR labelled `release-build`, so a broken
  # target is caught before tagging. Add the label, then push a commit.
  release-build:
    name: Release build
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'release/v') ||
       contains(github.event.pull_request.labels.*.name, 'release-build'))
    uses: ./.github/workflows/build-targets.yml
    with:
      ref: ${{ startsWith(github.head_ref, 'release/v') && github.head_ref || 'v0.0.0-ci' }}

  # Run the install scripts from this checkout against the real published
  # releases, on the same PRs as the release build.
  installer-smoke:
    name: Installer smoke (${{ matrix.os }})
    if: >-
      github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'release/v') ||
       contains(github.event.pull_request.labels.*.name, 'release-build'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install.sh (fresh, then early exit)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Releases before SHA256SUMS are verified through GitHub's API;
          # shared runners hit the anonymous rate limit without a token.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The installer uses the static musl build on Linux x86_64, which
          # releases before it was added don't have. Fetch the asset list on
          # its own line so a gh failure fails the step instead of looking
          # like "no musl build" (pipefail + grep -q would also SIGPIPE gh).
          if [ "$RUNNER_OS" = Linux ]; then
            assets=$(gh release view --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
            case "$assets" in
              *linux-musl*) ;;
              *) echo "Skipping: the latest release has no musl build yet."; exit 0 ;;
            esac
          fi
          DIR="$RUNNER_TEMP/docanvil-bin"
          sh install/install.sh --install-dir "$DIR"
          "$DIR/docanvil" --version
          sh install/install.sh --install-dir "$DIR" | grep "already installed"

      - name: install.ps1 on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'docanvil-ps51'
          & ./install/install.ps1 -InstallDir $dir
          & (Join-Path $dir 'docanvil.exe') --version
          $out = & ./install/install.ps1 -InstallDir $dir 6>&1 | Out-String
          if ($out -notmatch 'already installed') { throw "expected early exit, got: $out" }
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $kind = $key.GetValueKind('Path')
          $raw = $key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          if ($kind -ne 'ExpandString') { throw "user PATH type changed to $kind" }
          if (($raw -split ';') -notcontains $dir) { throw "user PATH is missing $dir" }

      - name: install.ps1 on PowerShell 7
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'docanvil-ps7'
          & ./install/install.ps1 -InstallDir $dir
          & (Join-Path $dir 'docanvil.exe') --version
          $out = & ./install/install.ps1 -InstallDir $dir 6>&1 | Out-String
          if ($out -notmatch 'already installed') { throw "expected early exit, got: $out" }
          # Reinstalling while docanvil is running must work: Windows locks a running exe.
          $exe = Join-Path $dir 'docanvil.exe'
          # A bare name, not a path: `docanvil new` writes it into docanvil.toml unescaped (#41).
          Push-Location $env:RUNNER_TEMP
          & $exe new running-site
          Pop-Location
          $site = Join-Path $env:RUNNER_TEMP 'running-site'
          $log = Join-Path $env:RUNNER_TEMP 'serve.log'
          $serve = Start-Process -FilePath $exe -ArgumentList 'serve', '--path', $site, '--port', '3917' -PassThru -NoNewWindow -RedirectStandardError $log
          try {
            Start-Sleep -Seconds 3
            if ($serve.HasExited) { Get-Content $log; throw "docanvil serve exited early (code $($serve.ExitCode))" }
            & ./install/install.ps1 -InstallDir $dir -Force
            & $exe --version
          } finally {
            Stop-Process -Id $serve.Id -Force -ErrorAction SilentlyContinue
          }
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $kind = $key.GetValueKind('Path')
          $raw = $key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          if ($kind -ne 'ExpandString') { throw "user PATH type changed to $kind" }
          if (($raw -split ';') -notcontains $dir) { throw "user PATH is missing $dir" }

  build:
    name: Build & Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Fingerprint master binary
        if: github.event_name == 'push' && runner.os == 'Linux'
        id: docs-binary
        run: echo "key=$(bash bin/docs-binary-key.sh)" >> "$GITHUB_OUTPUT"

      - name: Keep master binary for docs
        if: github.event_name == 'push' && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: master-docanvil-${{ steps.docs-binary.outputs.key }}
          path: target/debug/docanvil
          retention-days: 90

  cleanup-docs-binaries:
    name: Keep only the newest master docs binary
    needs: [lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    concurrency:
      group: master-docs-binary-cleanup
      cancel-in-progress: false
    steps:
      - name: Delete older master docs binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch every page before deleting, so pagination cannot skip entries.
          # Preserve the newest upload even if master runs finish out of order.
          artifacts=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100")
          old_ids=$(jq -r '
            [.[].artifacts[] | select(.name | startswith("master-docanvil-"))]
            | sort_by(.id) | reverse | .[1:][] | .id
          ' <<< "$artifacts")
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done <<< "$old_ids"
