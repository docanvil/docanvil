name: Build and Publish to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    # Never run this privileged workflow for PR CI or failed master builds.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Build the exact commit checked by CI, even if master has moved on.
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history, so [last_updated] dates are right (a shallow clone fails --strict)
          fetch-depth: 0

      - name: Wait for matching release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bin/wait-for-docs-release.sh

      - uses: ./.github/actions/docs-binary

      - name: Build docs site
        run: docanvil build --strict --path docs --out docs/public

      - name: Lint docs site
        run: docanvil doctor --strict --path docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public                       # 👈 directory to publish

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
