name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  

permissions:
  contents: write
  actions: read   # download artifacts from the release PR's CI run

jobs:
  # Release names, tags and asset names all come from the ref name, so a manual
  # run against a branch would publish a release named after the branch.
  check-ref:
    name: Check release ref
    runs-on: ubuntu-latest
    steps:
      - name: Ensure running on a version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != "tag" || "$REF_NAME" != v* ]]; then
            echo "::error::Releases must run on a version tag (e.g. v1.2.3), not $REF_TYPE '$REF_NAME'. When running manually, pick the tag in the 'Use workflow from' dropdown."
            exit 1
          fi

  # The release PR already built every target (ci.yml `release-build`). If that
  # build compiled exactly the tree this tag points at, publish those archives
  # rather than building them all again. Anything that doesn't line up (a
  # different tree, a failed or missing run, expired artifacts) falls back to a
  # fresh build below.
  find-prebuilt:
    name: Find release PR build
    needs: check-ref
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - name: Look for a matching CI run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          api="repos/$GITHUB_REPOSITORY"
          tag_tree=$(gh api "$api/commits/$GITHUB_SHA" -q .commit.tree.sha)

          # Filter in jq rather than with event/status query params: GitHub's
          # filtered run search occasionally returns nothing. Retry briefly too.
          for _ in 1 2 3; do
            run_id=$(gh api "$api/actions/workflows/ci.yml/runs?branch=release/$REF_NAME&per_page=20" \
              -q '[.workflow_runs[] | select(.event == "pull_request" and .conclusion == "success")][0].id // empty')
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "No successful CI run for release/$REF_NAME; building from scratch."
            exit 0
          fi

          artifacts=$(gh api "$api/actions/runs/$run_id/artifacts?per_page=100")
          usable=$(jq '[.artifacts[] | select(.name | startswith("docanvil-")) | select(.expired | not)] | length' <<<"$artifacts")
          expired=$(jq '[.artifacts[] | select(.name | startswith("docanvil-")) | select(.expired)] | length' <<<"$artifacts")
          if [ "$usable" -eq 0 ] || [ "$expired" -ne 0 ]; then
            echo "CI run $run_id has no usable release archives ($usable usable, $expired expired); building from scratch."
            exit 0
          fi

          if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name source-tree --dir prebuilt; then
            echo "CI run $run_id didn't record its source tree; building from scratch."
            exit 0
          fi
          built_tree=$(cat prebuilt/source-tree.txt)
          if [ "$built_tree" != "$tag_tree" ]; then
            echo "CI run $run_id built tree $built_tree, but $REF_NAME is $tag_tree; building from scratch."
            exit 0
          fi

          echo "Reusing $usable archives from CI run $run_id (source tree $tag_tree)."
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: find-prebuilt
    if: needs.find-prebuilt.outputs.run-id == ''
    uses: ./.github/workflows/build-targets.yml
    with:
      ref: ${{ github.ref_name }}

  release:
    name: Create GitHub Release
    needs: [find-prebuilt, build]
    # `build` is skipped when the release PR's archives are reused.
    if: >-
      !cancelled() && needs.find-prebuilt.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: docanvil-*
          merge-multiple: true
          # The release PR's CI run when reusing its builds, otherwise this run.
          run-id: ${{ needs.find-prebuilt.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Add checksums and install scripts
        run: |
          cd artifacts
          sha256sum docanvil-v* > SHA256SUMS
          cat SHA256SUMS
          cp ../install/install.sh ../install/install.ps1 .

      - name: Extract changelog body
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md \
            > release-notes.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} artifacts/* \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.txt

  publish:
    name: Publish to crates.io
    # A crates.io publish can't be undone, so only publish once the GitHub
    # Release (binaries + SHA256SUMS, which installers and `docanvil update`
    # rely on) exists.
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-publish-

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
