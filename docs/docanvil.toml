[project]
name = "DocAnvil"
content_dir = "docs"
logo = "assets/logo.png"
favicon = "assets/logo.png"
repo = "https://github.com/docanvil/docanvil"

[build]
output_dir = "dist"
base_url = "/docanvil/"
site_url = "https://docanvil.github.io/docanvil/"

[theme]
custom_css = "theme/custom.css"
color_mode = "both"
# Set CSS variables to customize the theme:
# [theme.variables]
# color-primary = "#6366f1"
# font-body = "Georgia, serif"

[edit]
repo = "https://github.com/docanvil/docanvil"
branch = "master"

[last_updated]
enabled = true

[llms]
enabled = true
description = "DocAnvil turns Markdown files into a polished, searchable documentation site with a single command. Built in Rust, with live reload, components, localisation, versioning and PDF export."

[locale]
default = "en"
enabled = ["en", "fr"]
auto_detect = true

[locale.display_names]
en = "English"
fr = "Français"

[pdf]
cover_page = true
author = "The DocAnvil Team"
